# FutureProofHomes Satellite1 -- unit 01
# Everything hardware-specific lives in profiles/satellite1.yaml.

substitutions:
  name: satellite1-d09ee8
  friendly_name: FutureProofHomes - Satellite1
  # MEASURED 2026-08-19: quiet room (AC hum only) sits at -72.3 dB, talking
  # plus background TV spans -67.8 to -63.6 dB. Floor set 1.3 dB above the
  # quiet mean so silence clamps to 0%; ceiling 1.6 dB above the loudest
  # observed. The old -55 was 17 dB above the real floor, which is why the
  # sensor read 0% permanently.
  ambient_min_db: "-71"
  ambient_max_db: "-62"

packages:
  plum: !include ../profiles/satellite1.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_satellite1_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

