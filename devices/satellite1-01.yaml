# FutureProofHomes Satellite1 -- unit 01
# Everything hardware-specific lives in profiles/satellite1.yaml.

substitutions:
  name: satellite1-d09ee8
  friendly_name: FutureProofHomes - Satellite1
  # Quiet-room floor measured on THIS unit. See docs/CALIBRATION.md.
  # -55 was validated against the old (peak, channel 0, gain 1) setup.
  # RE-MEASURE: this profile now reads RMS on channel 1 at gain 6.
  ambient_min_db: "-55"

packages:
  plum: !include ../profiles/satellite1.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_satellite1_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
