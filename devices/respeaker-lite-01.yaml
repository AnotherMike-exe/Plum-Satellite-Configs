# formatBCE ReSpeaker Lite -- unit 01
# Everything hardware-specific lives in profiles/respeaker-lite.yaml.
#
# This replaces a locally forked 1496-line monolith. See the MIGRATION note in
# profiles/respeaker-lite.yaml before flashing -- the custom set_alarm_time API
# action is gone, replaced by an `Alarm time` datetime entity.

substitutions:
  # Underscore is deliberate and must not be 'tidied': this is the live node
  # name. Changing it registers a NEW device in Home Assistant, orphaning
  # every existing entity, and changes the mDNS hostname.
  name: respeaker_lite-formatbce
  friendly_name: ReSpeaker Lite - formatBCE
  # MEASURED 2026-08-19: quiet room -76.1 dB mean (sd 1.11), so the floor is
  # mean + 2*sd quantised to the 0.25 grid. The old -50 default was 26 dB above
  # the real floor. Ceiling still unmeasured -- needs a loud sample in the room.
  ambient_min_db: "-74.0"

packages:
  plum: !include ../profiles/respeaker-lite.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_respeaker_lite_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

