# Home Assistant Voice PE -- unit 01
# Everything hardware-specific lives in profiles/voice-pe.yaml.

substitutions:
  name: home-assistant-voice-09472d
  friendly_name: Home Assistant Voice PE - 01
  # MEASURED 2026-08-19: quiet room -82.2 dB mean (sd 1.87), so the floor is
  # mean + 2*sd quantised to the 0.25 grid. The old -42 came from the broken
  # peak/channel-0/gain-1 setup and was 40 dB above the real floor, which is
  # why the sensor read 0% permanently.
  # Ceiling still unmeasured -- needs a loud sample with someone in the room.
  ambient_min_db: "-78.5"

packages:
  plum: !include ../profiles/voice-pe.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_voice_pe_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Uncomment while calibrating this unit's noise floor, then comment out again.
# See docs/CALIBRATION.md.
logger:
  level: DEBUG
  initial_level: DEBUG
  logs:
    ambient_sound: DEBUG
    dynamic_volume: DEBUG
    # Global level is the CEILING -- a per-tag level cannot be more verbose
    # than it, so calibration needs DEBUG globally. Quiet the flood by raising
    # noisy tags here, not by lowering the global level.
    sensor: WARN
    component: WARN
    api: WARN
