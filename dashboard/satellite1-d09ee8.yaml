# FutureProofHomes Satellite1 -- unit 01
# Paste into /config/esphome/ in the ESPHome Device Builder add-on.
# Shared logic comes from github://AnotherMike-exe/Plum-Satellite-Configs @ v1.0.0.

substitutions:
  # Must match the existing device in Home Assistant. Do not change.
  name: satellite1-d09ee8
  friendly_name: FutureProofHomes - Satellite1
  # First-boot defaults only; the device stores its own calibration.
  # Fully calibrated 2026-08-19: quiet -72.3 dB, active -67.8 to -63.6 dB.
  ambient_min_db: "-71"

  ambient_max_db: "-62"

packages:
  plum: github://AnotherMike-exe/Plum-Satellite-Configs/profiles/satellite1.yaml@v1.0.0

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_satellite1_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Uncomment while calibrating, then comment out again.
