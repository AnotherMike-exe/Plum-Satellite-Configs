# Home Assistant Voice PE -- unit 01
# Paste into /config/esphome/ in the ESPHome Device Builder add-on.
# Shared logic comes from github://AnotherMike-exe/Plum-Satellite-Configs @ v1.0.0.

substitutions:
  # Must match the existing device in Home Assistant. Do not change.
  name: home-assistant-voice-09472d
  friendly_name: Home Assistant Voice PE - 01
  # First-boot defaults only; the device stores its own calibration.
  # Floor measured 2026-08-19: quiet room -82.2 dB mean, sd 1.87.
  ambient_min_db: "-78.5"
  # NOT YET MEASURED -- run Calibrate Loud Ceiling with something playing.
  ambient_max_db: "0"

packages:
  plum: github://AnotherMike-exe/Plum-Satellite-Configs/profiles/voice-pe.yaml@v1.0.0

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

api:
  encryption:
    key: !secret api_key_voice_pe_01

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

