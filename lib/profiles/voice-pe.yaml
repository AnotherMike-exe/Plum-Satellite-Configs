# ---------------------------------------------------------------------------
# Profile: Home Assistant Voice PE (Nabu Casa)
#
# Vendor base + dynamic volume, with the hardware binding for this platform.
# Device files should include this and set only name / friendly_name /
# ambient_min_db.
#
# Verified against esphome/home-assistant-voice-pe @ 26.6.0:
#   microphone id .... i2s_mics
#   media player ..... external_media_player (speaker_source, 0.4 - 0.85)
#   wake word ........ mww, channels: 1, gain_factor: 4
#   min_version ...... 2026.5.0
# ---------------------------------------------------------------------------

substitutions:
  # Floor MEASURED 2026-08-19 on unit 01: quiet room -82.2 dB mean, sd 1.87.
  # Raw I2S with no AGC, so the floor sits ~7 dB below the Satellite1's and the
  # sample-to-sample spread is ~5x wider. Ceiling NOT yet measured -- left at 0
  # because this stream should reach much closer to full scale than the
  # AGC-flattened Satellite1 does. Run Calibrate Loud Ceiling to pin it down.
  ambient_min_db: "-78.5"
  ambient_max_db: "0"
  dv_curve_exponent: "0.4"

packages:
  vendor: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@26.6.0

  dynamic_volume: !include
    file: ../dynamic-volume.yaml
    vars:
      mic_id: i2s_mics
      mic_channel: "1"
      mic_gain_factor: "4"
      media_player_id: external_media_player
      wake_word_id: mww
      ambient_min_db: ${ambient_min_db}
      ambient_max_db: ${ambient_max_db}
      dv_curve_exponent: ${dv_curve_exponent}
      # The anchor is normalised 0..1 on every platform: both media player
      # platforms remap 0..1 onto their own volume_min/volume_max internally
      # (speaker_media_player.cpp:599, speaker_source_media_player.cpp:813),
      # so this device's declared volume range is transparent here.
      dv_anchor_min: "0.1"
      dv_anchor_max: "1.0"
      dv_anchor_default: "0.3"

# Some vendor bases (Satellite1) declare components such as improv_serial that
# hard-require `logger:`, so every profile provides one. `logger:` is a plain
# dict key and merges cleanly, so a device file can override any of this
# without !extend -- see docs/CALIBRATION.md for the debug settings to use
# while measuring a unit's noise floor.
# `initial_level` is set alongside `level` because some bases (formatBCE) ship
# `initial_level: debug`; dict-merging only our `level: INFO` on top leaves
# their initial_level behind and ESPHome rejects an initial level more severe
# than the global one.
logger:
  level: INFO
  initial_level: INFO
